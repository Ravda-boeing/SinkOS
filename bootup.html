  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="favicon.png" type="image/x-icon">
  <title>Sink OS Boot</title>
  <style>
    body {
      margin: 0;
      background-color: black;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      color: white;
      font-family: 'Segoe UI', sans-serif;
    }

    #boot-image, #boot-text {
      opacity: 0;
      transition: opacity 2s ease;
    }

    #boot-image {
      max-width: 80%;
      height: auto;
    }

    h3 {
      font-style: italic;
      margin-top: 20px;
    }

    /* Initializing bar */
    #init-container {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      width: 300px;
      text-align: center;
      transition: opacity 1s ease;
    }

    #init-label {
      font-size: 14px;
      letter-spacing: 2px;
      margin-bottom: 10px;
      opacity: 0.8;
    }

    #init-track {
      width: 100%;
      height: 6px;
      background: #222;
      border-radius: 3px;
      overflow: hidden;
    }

    #init-fill {
      width: 0%;
      height: 100%;
      background: white;
      border-radius: 3px;
      transition: width 10s linear;
    }
  </style>
</head>
<body>
  <audio id="startupSound" src="0626.mp3"></audio>
  <img src="Version 1.jpg" alt="Sink OS Boot Image" id="boot-image" />
  <h3 id="boot-text">Version 1. Codename Water</h3>

  <div id="init-container">
    <div id="init-label">Initializing</div>
    <div id="init-track"><div id="init-fill"></div></div>
  </div>

  <script>
    const image = document.getElementById("boot-image");
    const text = document.getElementById("boot-text");
    const sound = document.getElementById("startupSound");
    const initContainer = document.getElementById("init-container");
    const initFill = document.getElementById("init-fill");

    // Start the progress bar (needs a frame so the transition triggers)
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        initFill.style.width = "100%";
      });
    });

    // After 10s of initializing, fade out the bar and start the boot sequence
    setTimeout(() => {
      initContainer.style.opacity = 0;

      setTimeout(() => {
        image.style.opacity = 1;
        text.style.opacity = 1;

        sound.play().catch(() => {
          document.body.addEventListener('click', () => sound.play(), { once: true });
        });

        // Hold screen for 5s while sound plays
        setTimeout(() => {
          image.style.opacity = 0;
          text.style.opacity = 0;

          setTimeout(() => {
            window.location.href = "lockscreen.html";
          }, 2000);
        }, 5000);
      }, 1000); // wait for the bar fade-out

    }, 10000);
  </script>
</body>
</html>
