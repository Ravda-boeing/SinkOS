<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Choose your SinkOS</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg1:#bfe6ff;--bg2:#e9fbff;--bg3:#d6f5d6;
  --text:#0b2540;--muted:#3d5a76;
  --glass:rgba(255,255,255,.55);--glass-b:rgba(255,255,255,.85);
  --accent:#0a8fe0;--accent2:#35c46a;--shadow:rgba(10,80,140,.18);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg1:#06223d;--bg2:#0a3a5e;--bg3:#0b3b2e;
    --text:#eaf6ff;--muted:#a6c4dc;
    --glass:rgba(255,255,255,.08);--glass-b:rgba(255,255,255,.22);
    --shadow:rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;color:var(--text);
  background:linear-gradient(170deg,var(--bg1),var(--bg2) 45%,var(--bg3));background-color:var(--bg2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px}
.orb{width:44px;height:44px;border-radius:50%;margin-bottom:14px;
  background:radial-gradient(circle at 30% 25%,#fff,#6fd0ff 40%,#0a8fe0 75%);box-shadow:0 4px 14px var(--shadow)}
h1{margin:0 0 8px;font-size:clamp(28px,5vw,42px);letter-spacing:-.5px;text-align:center}
.sub{margin:0 0 32px;color:var(--muted);text-align:center}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;width:100%;max-width:700px}
.choice{font:inherit;color:inherit;text-align:left;cursor:pointer;padding:26px;border-radius:20px;
  background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(12px);
  box-shadow:0 10px 30px var(--shadow);transition:transform .15s,box-shadow .15s}
.choice:hover,.choice:focus-visible{transform:translateY(-4px);box-shadow:0 16px 40px var(--shadow);outline:2px solid var(--accent);outline-offset:2px}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;color:#fff;
  background:linear-gradient(180deg,#5cc8ff,#0a8fe0)}
.v2 .tag{background:linear-gradient(180deg,#6fe39a,#2aa957)}
.choice h2{margin:14px 0 8px;font-size:26px}
.choice p{margin:0 0 18px;color:var(--muted);font-size:14px;line-height:1.5}
.go{font-weight:600;color:var(--accent)}
.back{margin-top:28px;color:var(--muted);font-size:14px;text-decoration:underline}
</style>
</head>
<body>
  <div class="orb" aria-hidden="true"></div>
  <h1>Choose your SinkOS</h1>
  <p class="sub">Pick the version you want to run.</p>

  <div class="choices">
    <button class="choice v1" type="button" onclick="go(V1_URL)">
      <span class="tag">V1</span>
      <h2>SinkOS V1</h2>
      <p>The original SinkOS. You will be taken to the installer first.</p>
      <span class="go">Install V1 →</span>
    </button>
    <button class="choice v2" type="button" onclick="go(V2_URL)">
      <span class="tag">V2</span>
      <h2>SinkOS V2</h2>
      <p>The new SinkOS with the redesigned desktop and all modules.</p>
      <span class="go">Launch V2 →</span>
    </button>
  </div>

  <a class="back" href="index.html">← Back to homepage</a>

<script>
  // Where each choice sends the user. Change these two lines.
  var V1_URL = "installer.html";
  var V2_URL = "SinkOSV2/legal-consent.html"; // TODO: set the SinkOS V2 destination, e.g. "desktopv2.html"

  function go(url){
    if (url === "PLACEHOLDER") { alert("The SinkOS V2 link has not been set yet."); return; }
    window.location.href = url;
  }
</script>
</body>
</html>
